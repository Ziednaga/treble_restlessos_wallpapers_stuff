name: Build dist

on:
  push:
    branches: [main]
    paths:
      - "Wallpapers/**"
      - ".github/scripts/build_dist.py"
      - ".github/workflows/dist.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Build manifest and previews
        run: python .github/scripts/build_dist.py . "$GITHUB_REPOSITORY" "$RUNNER_TEMP/dist"

      - name: Push to dist branch
        working-directory: ${{ runner.temp }}/dist
        run: |
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dist for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" dist
